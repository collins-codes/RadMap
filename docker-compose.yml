services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: radmap
      POSTGRES_USER: radmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5434:5432"
    volumes:
      - radmap-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radmap -d radmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://radmap:${POSTGRES_PASSWORD:-change-me}@db:5432/radmap
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  radmap-postgres:
